name: Engine Protocol · Compilación

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Compilar y ejecutar pruebas
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Validar POMs y registrar dependencias en propagación (NO PUBLISH)
        run: |
          ./gradlew \
            :bedrock-codec:generatePomFileForMavenPublication \
            :bedrock-connection:generatePomFileForMavenPublication \
            -PcentralRelease=true --no-daemon
          python3 .github/scripts/verify-central-poms.py
          # The three vendor artifacts were uploaded to Sonatype, but Central
          # still returned HTTP 404 on 2026-11-01. PR integration is not a
          # release gate; the separate manual signing workflow is strict.
          python3 .github/scripts/audit-central-resolution.py \
            --pending io.github.ryzemcbe:bedrock-codec:1.26.60-R1 \
            --pending io.github.ryzemcbe:cloudburst-math-immutable:2.0.0-ryze.1 \
            --pending io.github.ryzemcbe:nukkit-natives-java:1.0.3-ryze.1 \
            --pending io.github.ryzemcbe:cloudburst-raknet:1.0.0.CR3-ryze.1 \
            bedrock-codec/build/publications/maven/pom-default.xml \
            bedrock-connection/build/publications/maven/pom-default.xml

      - name: Recordar puerta obligatoria de publicación
        run: |
          echo "::notice::Integración aprobable; Maven Central todavía no propagó los 3 POMs de vendor."
          echo "::notice::Antes de publicar ejecutar verify-maven-central-signing.yml (valida Maven Central sin OpenCollab)."

      - name: Guardar JAR de bedrock-codec y bedrock-connection
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: engine-protocol-${{ github.sha }}
          path: |
            bedrock-codec/build/libs/*.jar
            bedrock-connection/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
