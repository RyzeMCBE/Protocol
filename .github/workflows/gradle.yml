name: Engine Protocol · Compilación

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y probar (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Compilar y ejecutar pruebas
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Validar coordenadas de publicación Central (sin subir artefactos)
        run: |
          ./gradlew \
            :bedrock-codec:generatePomFileForMavenPublication \
            :bedrock-connection:generatePomFileForMavenPublication \
            -PcentralRelease=true --no-daemon
          python3 .github/scripts/verify-central-poms.py
          python3 .github/scripts/audit-central-resolution.py \
            --pending io.github.ryzemcbe:bedrock-codec:1.26.60-R1 \
            bedrock-codec/build/publications/maven/pom-default.xml \
            bedrock-connection/build/publications/maven/pom-default.xml

      - name: Compilar y probar publicación usando exclusivamente Maven Central
        run: |
          # No mavenLocal, OpenCollab, or other custom artifact repository.
          # This proves the released vendor dependencies and their transitive graph
          # are consumable by Gradle's standard Maven Central repository.
          ./gradlew :bedrock-codec:build :bedrock-connection:build \
            -PcentralRelease=true --refresh-dependencies --no-daemon

      - name: Guardar JAR de bedrock-codec y bedrock-connection
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: engine-protocol-${{ github.sha }}
          path: |
            bedrock-codec/build/libs/*.jar
            bedrock-connection/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
