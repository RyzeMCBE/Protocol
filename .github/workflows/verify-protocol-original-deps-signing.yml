name: Maven Central - Verify Protocol dependency GPG signatures (NO PUBLISH)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-original-deps-central-signing
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    name: Verify signed original-source artifacts (no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: maven-central

    steps:
      - name: Checkout reviewed Protocol main
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate GPG key fingerprint, format and passphrase without logging secrets
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          expected='0DE435F45DAAE3CCB759E01B32F428403DE9E4D8'
          if [[ -z "$PRIVATE_KEY" || -z "$PASSPHRASE" ]]; then
            echo '::error::Missing GPG_PRIVATE_KEY or GPG_PASSPHRASE in maven-central environment'
            exit 1
          fi
          if [[ "$PRIVATE_KEY" != *'-----BEGIN PGP PRIVATE KEY BLOCK-----'* || "$PRIVATE_KEY" != *'-----END PGP PRIVATE KEY BLOCK-----'* ]]; then
            echo '::error::GPG_PRIVATE_KEY is not a complete ASCII-armored PRIVATE key. Re-export with gpg --armor --export-secret-keys.'
            exit 1
          fi
          secure_home="$(mktemp -d)"
          chmod 700 "$secure_home"
          trap 'rm -rf "$secure_home"' EXIT
          export GNUPGHOME="$secure_home"
          if ! printf '%s\n' "$PRIVATE_KEY" | gpg --batch --quiet --import >/dev/null 2>&1; then
            echo '::error::GPG_PRIVATE_KEY cannot be imported by GnuPG. Check export and multiline secret content.'
            exit 1
          fi
          if ! gpg --batch --with-colons --list-secret-keys "$expected" 2>/dev/null | awk -F: -v expected="$expected" '$1 == "fpr" && $10 == expected {found=1} END {exit !found}'; then
            echo '::error::The supplied key does not match the original RyzeMCBE Development Studio fingerprint.'
            exit 1
          fi
          if ! printf 'RyzeMCBE Protocol signing check\n' | gpg --batch --quiet --yes --pinentry-mode loopback --passphrase-fd 3 --local-user "$expected" --detach-sign --output /dev/null 3<<<"$PASSPHRASE" >/dev/null 2>&1; then
            echo '::error::GnuPG cannot sign with this key/passphrase. Recheck GPG_PASSPHRASE or the key export.'
            exit 1
          fi
          echo 'PASS: expected fingerprint, GPG import and signature; no secret content logged.'

      - name: Check out pinned original Math source
        uses: actions/checkout@v7
        with:
          repository: CloudburstMC/math
          ref: 87f24259a74a5ed690251fcc940b97f3fb540e47
          path: vendor-upstream/math
          persist-credentials: false

      - name: Check out pinned original Natives source
        uses: actions/checkout@v7
        with:
          repository: CloudburstMC/Natives
          ref: 41826fe18358f7358707dc55e698abc16cdcc49a
          path: vendor-upstream/natives
          persist-credentials: false

      - name: Check out pinned original RakNet source
        uses: actions/checkout@v7
        with:
          repository: CloudburstMC/Network
          ref: 78a3224e829f2c4bcfe5a298320477d2f46ce6fa
          path: vendor-upstream/raknet
          persist-credentials: false

      - name: Verify all original source revisions and licenses
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C vendor-upstream/math rev-parse HEAD)" = 87f24259a74a5ed690251fcc940b97f3fb540e47
          test "$(git -C vendor-upstream/natives rev-parse HEAD)" = 41826fe18358f7358707dc55e698abc16cdcc49a
          test "$(git -C vendor-upstream/raknet rev-parse HEAD)" = 78a3224e829f2c4bcfe5a298320477d2f46ce6fa
          test -s vendor-upstream/math/LICENSE.txt
          test -s vendor-upstream/natives/LICENSE
          test -s vendor-upstream/raknet/LICENSE

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      - name: Generate the original Cloudburst Math Java sources
        shell: bash
        working-directory: vendor-upstream/math
        run: |
          set -euo pipefail
          sed -i 's/<version>3.3.0-SNAPSHOT<\/version>/<version>3.3.0<\/version>/' immutable/pom.xml
          mvn --batch-mode --no-transfer-progress -pl immutable -am -DskipTests package

      - name: Compile four modules and produce signed Maven distributions
        shell: bash
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey"
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKeyPassword"
          chmod +x ./gradlew
          mkdir -p vendor-central/cloudburst-math-api vendor-central/cloudburst-math-immutable vendor-central/nukkit-natives-java vendor-central/cloudburst-raknet
          ./gradlew -p vendor-central clean build \
            :cloudburst-math-api:signMavenPublication \
            :cloudburst-math-immutable:signMavenPublication \
            :nukkit-natives-java:signMavenPublication \
            :cloudburst-raknet:signMavenPublication \
            -PvendorCentralRelease=true --no-daemon

      - name: Verify signed sources, Javadoc, libraries and original licenses
        shell: bash
        run: |
          set -euo pipefail
          for module in cloudburst-math-api cloudburst-math-immutable nukkit-natives-java cloudburst-raknet; do
            folder="vendor-central/$module/build/libs"
            test -n "$(find "$folder" -maxdepth 1 -name '*sources.jar' -print -quit)"
            test -n "$(find "$folder" -maxdepth 1 -name '*javadoc.jar' -print -quit)"
            signatures=$(find "vendor-central/$module/build" -type f -name '*.asc' | wc -l)
            if [[ "$signatures" -lt 3 ]]; then
              echo "::error::$module: expected signed POM/JAR/sources/Javadoc; found $signatures signature files"
              exit 1
            fi
            pom="vendor-central/$module/build/publications/maven/pom-default.xml"
            test -s "$pom"
            grep -q '<groupId>io.github.ryzemcbe</groupId>' "$pom"
            grep -q '<licenses>' "$pom"
          done

      - name: Verify that publication was NOT attempted
        run: echo 'Signed files were generated and verified locally. Nothing was uploaded to Sonatype.'
